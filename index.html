<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Delius+Unicase:wght@400;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="grid-container">
    <header class="header">
        <div class="container">
            <h1 class="title title_1">Grid Layout from Ivan Vasylenko</h1>
        </div>
    </header>
    <main class="main">
        <div class="container">
            <section>
                <h2 class="title title_2">Architectural Photography</h2>
                <div class="gallery">
                    <div class="gal__item">
                        <img src="./assets/img/image-1.png" alt="" class="gal__img">
                        <div class="gal__title">
                            <span class="gal__author">Jezael Melgoza</span>
                            <span >5 June 2020</span>
                        </div>
                    </div>
                    <div class="gal__item gal__item_col-2">
                        <img src="./assets/img/image-2.png" alt="" class="gal__img">
                    </div>
                    <div class="gal__item gal__item_col-2">
                        <img src="./assets/img/image-3.png" alt="" class="gal__img">
                    </div>
                    <div class="gal__item">
                        <img src="./assets/img/image-4.png" alt="" class="gal__img">
                    </div>
                    <div class="gal__item">
                        <img src="./assets/img/image-5.png" alt="" class="gal__img">
                    </div>
                    <div class="gal__item gal__item_col-2">
                        <img src="./assets/img/image-6.png" alt="" class="gal__img">
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
