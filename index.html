<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson_14 Form Style</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Delius+Unicase:wght@400;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main class="main">
        <section class="section">
            <div class="side">
                <h2 class="title_2">Create an Account</h2>
                <form action="" class="form">
                    <div class="row">
                        <div class="col col_half">
                            <label for="#first-name" class="label">First Name</label>
                            <input type="text" id="first-name">
                        </div>
                        <div class="col col_half">
                            <label for="#last-name" class="label">Last Name</label>
                            <input type="text" id="last-name">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col col_full">
                            <label for="#mail" class="label">E-mail</label>
                            <input type="mail" id="mail">
                            <p>We'll never share your email with anyone else.</p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col"></div>
                    </div>
                    <div class="row">
                        <div class="col_half"></div>
                        <div class="col_half"></div>
                    </div>
                    <div class="row">
                        <div class="col"></div>
                    </div>
                    <div class="row">
                        <div class="col"></div>
                    </div>
                    <div class="row">
                        <div class="col"></div>
                    </div>
                </form>
            </div>
            <div class="side">
                <h2 class="title_2">Profile</h2>
                <form action="" class="form">
                    <div class="row"></div>
                    <div class="row"></div>
                    <div class="row"></div>
                    <div class="row"></div>
                    <div class="row"></div>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
